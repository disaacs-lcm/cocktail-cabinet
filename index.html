<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cocktail Cabinet</title>
  <meta name="description" content="Seven arcade games, each playable by a human or the computer on either side of the table.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="marquee">
    <h1><a href="#">Cocktail Cabinet</a></h1>
    <p>Seven games. Sit on either side of the table.</p>
  </header>

  <main id="menu" class="menu" aria-label="Game selection"></main>

  <section id="stage" class="stage" hidden>
    <div class="stage-bar">
      <button id="btn-back" class="btn ghost" type="button">&larr; Cabinet</button>
      <div class="stage-title">
        <span id="stage-name"></span>
        <span id="stage-mode" class="pill"></span>
      </div>
      <button id="btn-pause" class="btn ghost" type="button">Pause</button>
    </div>
    <div class="bezel" id="bezel">
      <canvas id="screen" width="800" height="600" tabindex="0" aria-label="Game screen"></canvas>
      <div id="dom-layer" class="dom-layer" hidden></div>
      <div id="overlay" class="overlay" hidden></div>
    </div>
    <p id="help" class="help"></p>
  </section>

  <footer class="foot">
    <span>Static HTML/CSS/JS &middot; every computer player uses the same controls and physics as a human.</span>
  </footer>

  <!-- PeerJS: WebRTC data channels for Imitation's two-browser play (public broker, no API key) -->
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="js/cabinet.js"></script>
  <script src="js/games/snake.js"></script>
  <script src="js/games/breakout.js"></script>
  <script src="js/games/splat.js"></script>
  <script src="js/games/asteroids.js"></script>
  <script src="js/games/missile.js"></script>
  <script src="js/games/imitation.js"></script>
  <script src="js/games/pong.js"></script>
  <script>Cab.boot();</script>
</body>
</html>
